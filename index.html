<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Квиз для Поли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --kraft:#ecdcc0;--cream:#fffaf0;--ink:#2b2320;--ink2:#6b5a4e;
  --coral:#ef6f5e;--mustard:#f2b134;--teal:#2a9d8f;--plum:#7b4b94;
  --pink:#f7b9c6;--wine:#8e2c48;--navy:#264653;--sky:#a9d6e5;--leaf:#83b56a;
  --sh:2px 3px 0 rgba(70,45,20,.22),0 14px 26px -10px rgba(70,45,20,.45);
  --u:min(1vw,1.75vh);
}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(circle at 15% 10%,#f6ead4 0,transparent 45%),
    radial-gradient(circle at 85% 90%,#e3cba4 0,transparent 50%),
    var(--kraft);
  font-family:Rubik,system-ui,sans-serif;color:var(--ink);
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
body.player{overflow-x:hidden;overflow-y:auto}
#grain{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .18 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hand{font-family:Caveat,cursive}
.paper{background:var(--cream);box-shadow:var(--sh);border-radius:6px 14px 8px 16px/14px 6px 16px 8px;transform:rotate(var(--r,0deg))}
.sticker{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 4px 0 rgba(70,45,20,.25))}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.7em 1.3em;font-weight:700;font-size:16px;
  background:var(--cream);box-shadow:var(--sh);border-radius:8px 14px 10px 12px/12px 8px 14px 10px;transition:transform .12s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.coral{background:var(--coral);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.mustard{background:var(--mustard)}
.btn:disabled{opacity:.45;cursor:default}
.small{font-size:13px;color:var(--ink2)}
.c0{--c:var(--coral)}.c1{--c:var(--mustard)}.c2{--c:var(--teal)}.c3{--c:var(--plum)}

/* garland */
.garland{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*7);pointer-events:none;z-index:2}
.garland svg{width:100%;height:100%}

/* tools */
#tools{position:fixed;right:10px;bottom:10px;z-index:80;display:flex;gap:6px;opacity:.55;transition:opacity .2s}
#tools:hover{opacity:1}
#tools button{width:38px;height:38px;border-radius:50%;background:var(--cream);box-shadow:var(--sh);font-size:17px}
#tools button.off{opacity:.45;text-decoration:line-through}

/* ---------- LOBBY ---------- */
.screen{position:absolute;inset:0;padding:calc(var(--u)*8) calc(var(--u)*4) calc(var(--u)*4);display:flex;gap:calc(var(--u)*4)}
.lobby{padding-top:calc(var(--u)*9)}
.lobby .left{flex:0 0 40%;display:flex;flex-direction:column;gap:calc(var(--u)*2.2);align-items:center;justify-content:center}
.lobby .right{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2)}
.title-card{padding:calc(var(--u)*2.2) calc(var(--u)*3);text-align:center;background:var(--pink)}
.title-card .kicker{font-size:calc(var(--u)*3);color:var(--wine);line-height:1}
.title-card h1{margin:.1em 0;font-size:calc(var(--u)*3.8);line-height:1.05;font-weight:900}
.title-card h1 span{color:var(--wine)}
.title-card .sub{font-weight:500;font-size:calc(var(--u)*1.9)}
.qr-card{padding:calc(var(--u)*1.5);text-align:center;width:calc(var(--u)*25)}
#qr{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px}
#qr svg{width:100%;height:100%}
.qr-card .hand{font-size:calc(var(--u)*3);margin-top:.2em;line-height:1}
.qr-card .small{word-break:break-all;font-size:calc(var(--u)*1.15)}
.warn{background:#fff1c9;color:#7a4b00;padding:.4em .6em;border-radius:6px;margin-top:.4em;font-size:calc(var(--u)*1.3)}
.lobby h2{font-size:calc(var(--u)*5);margin:0;line-height:1}
.lobby-players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding-right:calc(var(--u)*1);gap:calc(var(--u)*2)}
.pcard{position:relative;padding:calc(var(--u)*1.5) calc(var(--u)*2);display:flex;align-items:center;gap:calc(var(--u)*1.5);min-height:calc(var(--u)*10);animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both}
.pcard .em{font-size:calc(var(--u)*6);line-height:1}
.pcard .nm{font-weight:700;font-size:calc(var(--u)*2.4)}
.pcard .ph{overflow-wrap:anywhere;font-family:Caveat,cursive;font-size:calc(var(--u)*2.1);color:var(--ink2);line-height:1.1}
.pcard .x{position:absolute;top:4px;right:6px;background:none;font-size:16px;color:var(--ink2);opacity:.5}
.pcard .dot{position:absolute;bottom:8px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--leaf)}
.pcard .dot.off{background:#c9b49a}
.slot{border:3px dashed rgba(107,90,78,.35);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:calc(var(--u)*10);
  font-family:Caveat,cursive;font-size:calc(var(--u)*2.6);color:rgba(107,90,78,.6)}
.lobby-actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:calc(var(--u)*1)}
.lobby-actions .btn.big{font-size:calc(var(--u)*2.8);padding:.55em 1.4em}
.lobby-actions .row{display:flex;gap:10px;flex-wrap:wrap}
.lobby-actions label.btn{font-size:14px;padding:.6em 1em}
.lobby-actions .btn.small{font-size:14px;padding:.6em 1em}

/* ---------- QUESTION ---------- */
.qs{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:calc(var(--u)*1.8)}
.qs.revealed .qcard{font-size:calc(var(--u)*2.7);padding:calc(var(--u)*1.6) calc(var(--u)*3)}
.qtop{display:flex;align-items:center;gap:calc(var(--u)*2)}
.chip{padding:.35em .9em;font-weight:700;font-size:calc(var(--u)*2.2);background:var(--c);color:#fff}
.qnum{font-size:calc(var(--u)*3.6);flex:1}
.timer{position:relative;width:calc(var(--u)*10);height:calc(var(--u)*10)}
.timer svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(2px 3px 0 rgba(70,45,20,.22))}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*3.6)}
.timer.hot .num{color:var(--coral);animation:pulse .5s infinite alternate}
.qcard{padding:calc(var(--u)*2.4) calc(var(--u)*4);font-size:calc(var(--u)*3.3);font-weight:700;line-height:1.2;text-align:center;animation:dropIn .6s cubic-bezier(.3,1.4,.5,1) both}
.opts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:calc(var(--u)*2);min-height:0}
.opt{position:relative;display:flex;align-items:center;gap:calc(var(--u)*1.8);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);background:var(--c);color:#fff;
  font-size:calc(var(--u)*2.8);font-weight:700;line-height:1.15;min-height:0;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both;transition:opacity .4s,transform .4s,filter .4s}
.opt .ol{flex:0 0 auto;width:calc(var(--u)*5.5);height:calc(var(--u)*5.5);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);color:var(--c);
  font-weight:900;font-size:calc(var(--u)*3);border-radius:50% 46% 52% 48%/48% 52% 46% 50%}
.opt .ot{flex:1}
.opt .pickers{flex:0 0 auto;font-size:calc(var(--u)*3.2);display:flex;gap:2px}
.revealed .opt.wrong{opacity:.35;filter:saturate(.3);transform:rotate(var(--r)) scale(.96)}
.revealed .opt.right{transform:rotate(0) scale(1.03);box-shadow:0 0 0 calc(var(--u)*.6) #fff,var(--sh)}
.revealed .opt.right::after{content:'✓';position:absolute;top:-.55em;right:-.3em;font-size:calc(var(--u)*5);background:var(--leaf);color:#fff;width:1.2em;height:1.2em;
  border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);animation:popIn .5s .2s both}
.prow{display:flex;gap:calc(var(--u)*1.5);justify-content:center;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:.4em;padding:.35em .8em;font-size:calc(var(--u)*2);font-weight:700;transition:background .3s}
.pchip .em{font-size:1.5em;line-height:1}
.pchip .st{font-weight:500;font-size:.85em;color:var(--ink2)}
.pchip.done{background:#e3f1d6}
.pchip.ok{background:var(--leaf);color:#fff}.pchip.ok .st{color:#fff}
.pchip.no{background:#f3d3cc}
.pchip .tot{font-weight:900;margin-left:.2em}
.fact{display:flex;gap:calc(var(--u)*2);align-items:center}
.fact .paper{flex:1;padding:calc(var(--u)*1.2) calc(var(--u)*2.2);font-size:calc(var(--u)*2.1);background:#fff7d6;animation:dropIn .6s .4s both}
.fact .paper b{font-family:Caveat,cursive;font-size:1.35em;color:var(--wine)}
.nextbtn{font-size:calc(var(--u)*2.6)!important}

/* ---------- STANDINGS / FINAL ---------- */
.center{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bigtitle{font-size:calc(var(--u)*6);margin:0;line-height:1}
.ranklist{display:flex;flex-direction:column;gap:calc(var(--u)*1.5);width:min(90%,calc(var(--u)*80))}
.rank{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.2) calc(var(--u)*2.5);font-size:calc(var(--u)*3);font-weight:700;animation:slideIn .5s cubic-bezier(.3,1.4,.5,1) both}
.rank .pl{font-family:Caveat,cursive;font-size:1.5em;width:1.6em;color:var(--wine)}
.rank .em{font-size:1.6em;line-height:1}
.rank .nm{flex:1;text-align:left}
.rank .sc{font-weight:900}
.rank .sub{font-size:.55em;color:var(--ink2);font-weight:500}
.podium{display:flex;align-items:flex-end;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*2)}
.pod{display:flex;flex-direction:column;align-items:center;width:calc(var(--u)*20)}
.pod .em{font-size:calc(var(--u)*8);line-height:1;animation:bounce 1.6s ease-in-out infinite}
.pod .nm{font-weight:700;font-size:calc(var(--u)*2.5);margin:.2em 0}
.pod .block{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.2em;background:var(--c);color:#fff;
  font-weight:900;font-size:calc(var(--u)*4.4);border-radius:8px 14px 0 0;box-shadow:var(--sh);animation:grow .9s cubic-bezier(.3,1.3,.5,1) both}
.pod .block small{font-size:.4em;font-weight:700}
.others{display:flex;gap:calc(var(--u)*2);margin-top:calc(var(--u)*3);flex-wrap:wrap;justify-content:center}

/* ---------- INTRO ---------- */
.intro{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
.scene.on{opacity:1;pointer-events:auto}
.scene .pop{opacity:0}
.scene.on .pop{animation:popIn .7s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.scene.on .drop{animation:dropIn .8s cubic-bezier(.3,1.4,.5,1) var(--d,0s) both}
.scene.on .slide{animation:slideIn .7s cubic-bezier(.3,1.4,.5,1) var(--d,0s) both}
.curtain{position:absolute;top:0;bottom:0;width:51%;background:var(--wine);z-index:5;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2%,transparent 2% 8%);box-shadow:0 0 30px rgba(0,0,0,.4)}
.curtain.l{left:0;border-radius:0 0 40% 0}
.curtain.r{right:0;border-radius:0 0 0 40%}
.intro.go .curtain.l{animation:openL 1.6s 1.6s cubic-bezier(.6,0,.3,1) forwards}
.intro.go .curtain.r{animation:openR 1.6s 1.6s cubic-bezier(.6,0,.3,1) forwards}
.s-title{font-size:calc(var(--u)*6);font-weight:900;text-align:center;line-height:1.1}
.s-title .hand{display:block;font-size:.7em;color:var(--wine);font-weight:700}
.letters{display:flex;gap:calc(var(--u)*1.5)}
.letter{width:calc(var(--u)*15);height:calc(var(--u)*18);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*13);color:#fff;background:var(--c)}
.photo{width:calc(var(--u)*24);aspect-ratio:3/4;background:#fff;padding:calc(var(--u)*1.2) calc(var(--u)*1.2) calc(var(--u)*4);box-shadow:var(--sh);transform:rotate(var(--r,0deg));position:relative}
.photo .img{width:100%;height:100%;background:#e9dccb center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:Caveat,cursive;font-size:calc(var(--u)*2.4);color:var(--ink2)}
.photo .cap{position:absolute;left:0;right:0;bottom:calc(var(--u)*.6);text-align:center;font-family:Caveat,cursive;font-size:calc(var(--u)*2.6)}
.photo .tape{position:absolute;top:-12px;left:50%;width:40%;height:24px;margin-left:-20%;background:rgba(242,177,52,.65);transform:rotate(-4deg)}
.lay{display:flex;align-items:center;gap:calc(var(--u)*5)}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.loves{display:grid;grid-template-columns:repeat(3,auto);gap:calc(var(--u)*2.5) calc(var(--u)*3.5)}
.love{display:flex;flex-direction:column;align-items:center;gap:.3em;font-weight:700;font-size:calc(var(--u)*2.4)}
.love .e{font-size:calc(var(--u)*8);line-height:1}
.love svg{width:calc(var(--u)*10);height:calc(var(--u)*8)}
.tag{padding:.45em .9em;font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.2;background:var(--c,var(--cream));color:var(--tc,var(--ink))}
.tag.dark{color:#fff}
.bed{position:relative;width:calc(var(--u)*44);height:calc(var(--u)*26)}
.clockcard{font-weight:900;font-size:calc(var(--u)*7);padding:.15em .5em;background:var(--navy);color:#ffd36b;font-variant-numeric:tabular-nums}
.themes{display:flex;gap:calc(var(--u)*2.5);flex-wrap:wrap;justify-content:center;max-width:90%}
.theme{display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*1.5) calc(var(--u)*2.5);background:var(--c);color:#fff;font-weight:700;font-size:calc(var(--u)*2.6)}
.theme .e{font-size:calc(var(--u)*6)}
.georgia{font-size:calc(var(--u)*11);font-weight:900;color:var(--wine);line-height:1}
.drum{font-family:Caveat,cursive;font-size:calc(var(--u)*4.5);color:var(--ink2)}
.scene.on .shake{animation:shake .12s linear var(--d,0s) 18}
.skip{position:absolute;right:16px;top:16px;z-index:20;font-size:14px;padding:.5em 1em}
.gobtn{font-size:calc(var(--u)*4)!important;padding:.4em 1.4em!important}
.sun{position:absolute;border-radius:50%;background:var(--coral);opacity:.9}

/* ---------- WINNER ---------- */
.win{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3b5a66 0,#1f3640 70%);color:#fff}
.spot{position:absolute;left:50%;top:-10%;width:70vmin;height:120vmin;margin-left:-35vmin;background:radial-gradient(ellipse at 50% 0,rgba(255,240,190,.55),transparent 70%);
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:0;transition:opacity 1s}
.win.lit .spot{opacity:1}
.win .and{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Caveat,cursive;font-size:calc(var(--u)*8);transition:opacity .4s}
.win.lit .and{opacity:0}
.winbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);opacity:0}
.win.lit .winbox{opacity:1}
.winem{font-size:calc(var(--u)*24);line-height:1;transform:scale(0)}
.win.lit .winem{animation:bigPop 1s cubic-bezier(.3,1.6,.5,1) forwards,bounce 1.8s 1s ease-in-out infinite}
.crown{font-size:calc(var(--u)*9);line-height:.6;opacity:0}
.win.lit .crown{animation:dropIn .7s .5s both}
.ribbon{position:relative;padding:.3em 1.6em;background:var(--coral);color:#fff;font-weight:900;font-size:calc(var(--u)*5);opacity:0;
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.win.lit .ribbon{animation:popIn .6s .7s both}
.bubble{position:relative;max-width:min(80%,calc(var(--u)*80));padding:.6em 1.2em;background:var(--cream);color:var(--ink);font-family:Caveat,cursive;font-size:calc(var(--u)*5);
  line-height:1.1;text-align:center;border-radius:30px 36px 32px 28px;box-shadow:var(--sh);opacity:0;transform:rotate(-1.5deg)}
.bubble::before{content:'';position:absolute;top:-22px;left:50%;margin-left:-16px;border:16px solid transparent;border-bottom:22px solid var(--cream);border-top:0}
.win.phrase .bubble{animation:popIn .6s both}
.win .finalbtn{position:absolute;bottom:calc(var(--u)*4);left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .5s}
.win.done .finalbtn{opacity:1;pointer-events:auto}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.cf{position:absolute;top:-5vh;width:14px;height:9px;animation:fall linear forwards}
.cf i{display:block;width:100%;height:100%;background:var(--c);animation:sway ease-in-out infinite alternate}

/* ---------- PLAYER (phone) ---------- */
.ph{min-height:100%;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto}
.ph h1{margin:0;font-size:30px;font-weight:900;line-height:1.05}
.ph h1 .hand{display:block;color:var(--wine);font-size:26px;font-weight:700}
.ph .card{padding:16px}
.ph label.lbl{display:block;font-weight:700;margin-bottom:6px}
.ph input[type=text]{width:100%;font:500 18px Rubik,sans-serif;padding:12px 14px;border:2px solid #d9c6a8;border-radius:10px;background:#fff;color:var(--ink)}
.ph input[type=text]:focus{outline:none;border-color:var(--teal)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{font-size:30px;aspect-ratio:1;background:#fff;border-radius:10px;border:2px solid transparent;padding:0;line-height:1}
.emojis button.sel{border-color:var(--coral);background:#ffe9e3;transform:scale(1.08)}
.ph .go{font-size:20px;padding:.8em}
.me{display:flex;align-items:center;gap:12px;padding:10px 14px}
.me .em{font-size:40px;line-height:1}
.me .nm{font-weight:700;font-size:18px;flex:1}
.me .sc{font-weight:900;font-size:20px}
.wait{text-align:center;padding:30px 16px;font-size:20px}
.wait .big{font-size:70px;line-height:1;display:block;margin-bottom:8px;animation:bounce 1.6s ease-in-out infinite}
.wait .hand{font-size:28px;color:var(--wine)}
.pq{padding:12px 14px;font-weight:700;font-size:17px;line-height:1.25}
.pq .meta{font-weight:500;font-size:13px;color:var(--ink2);margin-bottom:4px}
.pbar{height:12px;background:#dcc8a8;border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);transform-origin:left;transition:background .3s}
.popts{display:flex;flex-direction:column;gap:12px}
.popt{display:flex;align-items:center;gap:12px;padding:16px 14px;background:var(--c);color:#fff;font-weight:700;font-size:18px;text-align:left;line-height:1.15;min-height:70px}
.popt .ol{flex:0 0 auto;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--c);border-radius:50%;font-weight:900;font-size:22px}
.popt.dim{opacity:.3}
.popt.mine{box-shadow:0 0 0 5px #fff,0 0 0 8px var(--ink)}
.res{text-align:center;padding:26px 16px}
.res .big{font-size:90px;line-height:1}
.res h2{margin:.2em 0 0;font-size:32px}
.res .pts{font-size:22px;font-weight:700;margin-top:6px}
.res .ans{margin-top:10px;font-size:16px;color:var(--ink2)}
.status{text-align:center;font-size:13px;color:var(--ink2)}

/* ---------- anim ---------- */
@keyframes popIn{0%{opacity:0;transform:rotate(var(--r,0deg)) scale(.3)}100%{opacity:1;transform:rotate(var(--r,0deg)) scale(1)}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-60px) rotate(calc(var(--r,0deg) - 8deg))}100%{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
@keyframes slideIn{0%{opacity:0;transform:translateX(-80px) rotate(var(--r,0deg))}100%{opacity:1;transform:translateX(0) rotate(var(--r,0deg))}}
@keyframes bigPop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
@keyframes pulse{to{transform:scale(1.15)}}
@keyframes grow{from{height:0!important;opacity:0}}
@keyframes openL{to{transform:translateX(-105%)}}
@keyframes openR{to{transform:translateX(105%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@keyframes sway{from{transform:translateX(-20px) rotateY(0)}to{transform:translateX(20px) rotateY(180deg)}}
/* ---------- tools не перекрывают контент ---------- */
.screen{padding-bottom:calc(var(--u)*3 + 54px)}
/* ---------- вертикальные экраны (телефон, планшет стоя) ---------- */
@media (orientation:portrait){
  :root{--u:min(1.9vw,1.15vh)}
  #tools{bottom:auto;top:calc(var(--u)*7 + 6px);right:8px;gap:4px}
  #tools button{width:32px;height:32px;font-size:14px}
  .screen{padding:calc(var(--u)*10) 14px 16px}
  .qs{grid-template-rows:auto auto auto auto auto;align-content:start;overflow-y:auto}
  .qtop{flex-wrap:wrap;gap:8px;padding-right:44px}
  .qnum{flex:1 1 auto}
  .qcard{font-size:calc(var(--u)*3.4)}
  .qs.revealed .qcard{font-size:calc(var(--u)*3)}
  .opts{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto;gap:calc(var(--u)*1.6)}
  .opt{min-height:calc(var(--u)*9);font-size:calc(var(--u)*3.2);padding:calc(var(--u)*1.6) calc(var(--u)*2.4) calc(var(--u)*1.6) calc(var(--u)*2)}
  .opt .pickers{position:static;margin-left:auto;font-size:calc(var(--u)*3.6)}
  .revealed .opt.right::after{font-size:calc(var(--u)*4);top:-.4em;right:-.2em}
  .pchip{font-size:calc(var(--u)*2.3)}
  .fact{flex-direction:column;align-items:stretch}
  .fact .paper{font-size:calc(var(--u)*2.5)}
  .nextbtn{align-self:center}
  .lobby{flex-direction:column;overflow-y:auto;justify-content:flex-start}
  .lobby .left,.lobby .right{flex:0 0 auto}
  .lobby .left{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .qr-card{width:min(60vw,calc(var(--u)*34))}
  .title-card h1{font-size:calc(var(--u)*4.6)}
  .lobby h2{text-align:center}
  .lobby-actions{align-items:center}
  .lay{flex-direction:column;gap:calc(var(--u)*3)}
  .photo{width:calc(var(--u)*26)}
  .letter{width:calc(var(--u)*11);height:calc(var(--u)*14);font-size:calc(var(--u)*10)}
  .loves{grid-template-columns:repeat(3,auto)}
  .tag{font-size:calc(var(--u)*2.8)}
  .bed{width:calc(var(--u)*40);height:calc(var(--u)*24)}
  .scene[data-t="3"] .lay>.col:last-child{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .themes{max-width:96%}
  .ranklist{width:100%}
  .pod{width:calc(var(--u)*24)}
  .bubble{font-size:calc(var(--u)*4.4)}
  .ribbon{font-size:calc(var(--u)*5.5)}
}
.opt.mid .ot{font-size:.88em}.opt.long .ot{font-size:.74em}
.opt .ot{overflow-wrap:anywhere}
.popt.long{font-size:16px}
.podium{max-width:100%;justify-content:center}
.pod{flex:0 1 calc(var(--u)*20);min-width:0}
.pod .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .block small{text-align:center;line-height:1.1;padding:0 4px}
.rank .nm{min-width:0;overflow-wrap:anywhere}
@media (orientation:portrait){
  .qs{grid-template-rows:repeat(5,max-content)}
  .opt{min-height:max-content}
  .opts>.opt{min-height:calc(var(--u)*9)}
  .scene{padding:calc(var(--u)*9) 12px calc(var(--u)*3);overflow:hidden}
  .scene[data-t="4"] .photo{width:calc(var(--u)*17)}
  .scene[data-t="4"] .tag{font-size:calc(var(--u)*2.5)}
  .scene[data-t="2"] .photo,.scene[data-t="1"] .photo{width:calc(var(--u)*22)}
  .podium{gap:calc(var(--u)*1.5)}
  .pod{flex:1 1 0;max-width:calc(var(--u)*24)}
  .pod .block{font-size:calc(var(--u)*4)}
}
@media (orientation:portrait) and (max-width:600px){
  .lobby-players{grid-template-columns:1fr}
  .pcard{min-height:calc(var(--u)*9)}
  .qr-card{width:min(62vw,260px)}
}
.georgia-row{gap:calc(var(--u)*4)}
.georgia-row .photo{width:calc(var(--u)*17)}
@media (orientation:portrait){.georgia-row{flex-direction:row}.georgia-row .georgia{font-size:calc(var(--u)*8)}.georgia-row .photo{width:calc(var(--u)*20)}}
.owlph .photo{width:calc(var(--u)*17)}
@media (orientation:portrait){.owlph .photo{width:calc(var(--u)*15)}}
.photo .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.scene[data-t="5"] .theme{font-size:calc(var(--u)*2.1);padding:calc(var(--u)*1) calc(var(--u)*1.8)}
.scene[data-t="5"] .theme .e{font-size:calc(var(--u)*4.2)}
.scene[data-t="5"] .themes{flex-wrap:nowrap;gap:calc(var(--u)*1.8)}
.georgia-row .georgia{font-size:calc(var(--u)*9)}
.georgia-row .photo{width:calc(var(--u)*16)}
@media (orientation:portrait){
  .scene[data-t="5"] .themes{flex-wrap:wrap}
  .georgia-row{flex-direction:column!important;gap:calc(var(--u)*2)!important}
  .georgia-row .georgia{font-size:calc(var(--u)*9)!important}
  .georgia-row .photo{width:calc(var(--u)*20)!important}
}
@media (orientation:landscape){
  .lobby-players.many{grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*1.5)}
  .lobby-players.many .pcard{min-height:calc(var(--u)*9);padding:calc(var(--u)*1.2)}
  .lobby-players.many .pcard .em{font-size:calc(var(--u)*4.5)}
  .lobby-players.many .pcard .nm{font-size:calc(var(--u)*2.1)}
  .lobby-players.many .pcard .ph{font-size:calc(var(--u)*1.8)}
  .lobby-players.many .slot{min-height:calc(var(--u)*9)}
  .lobby .right{gap:calc(var(--u)*1.5)}
  .lobby h2{font-size:calc(var(--u)*4.2)}
  .center .bigtitle{font-size:calc(var(--u)*5)}
  .center{gap:calc(var(--u)*1.5)!important}
  .rank{padding:calc(var(--u)*.7) calc(var(--u)*2.2);font-size:calc(var(--u)*2.5)}
  .ranklist{gap:calc(var(--u)*1)}
  .pod .em{font-size:calc(var(--u)*6.5)}
  .pod .nm{font-size:calc(var(--u)*2.1)}
  .podium{margin-top:0}
}
@media (orientation:landscape){
  .lobby-players.many .pcard{flex-direction:column;justify-content:center;text-align:center;gap:calc(var(--u)*.4);min-height:0;padding:calc(var(--u)*1) calc(var(--u)*1)}
  .lobby-players.many .pcard .em{font-size:calc(var(--u)*4)}
  .lobby-players.many .pcard .ph{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lobby-players.many .slot{min-height:calc(var(--u)*11)}
  .lobby .right{justify-content:center}
}
/* ---------- безопасные отступы ---------- */
:root{--safeT:calc(var(--u)*7 + 22px + env(safe-area-inset-top,0px));--safeB:calc(58px + env(safe-area-inset-bottom,0px))}
.screen{padding-top:var(--safeT)!important;padding-bottom:var(--safeB)!important;padding-left:calc(var(--u)*4 + env(safe-area-inset-left,0px));padding-right:calc(var(--u)*4 + env(safe-area-inset-right,0px))}
.scene{padding-top:var(--safeT);padding-bottom:var(--safeB)}
.garland{top:env(safe-area-inset-top,0px)}
#tools{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.lobby .left,.lobby .right{min-height:0}
[data-fit]{overflow:hidden}
.fit{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.2);width:100%}
.screen.center>.fit{gap:calc(var(--u)*1.6);text-align:center}
.lobby .right>.fit{align-items:stretch;gap:calc(var(--u)*1.5)}
.lobby .left,.lobby .right{justify-content:center}
.qr-card{width:calc(var(--u)*26)}
@media (orientation:portrait){
  :root{--safeT:calc(var(--u)*9 + 20px + env(safe-area-inset-top,0px));--safeB:calc(16px + env(safe-area-inset-bottom,0px))}
  [data-fit]{overflow:visible}
}
@media (orientation:landscape){
  :root{--u:min(1vw,1.5vh)}
  .lobby-players.many .slot{font-size:calc(var(--u)*2.1);text-align:center;padding:0 8px}
  .revealed .pchip{font-size:calc(var(--u)*1.8)}
  .qs{gap:calc(var(--u)*1.4)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

const AudioFX = (() => {
  let ctx, master, musicGain, timer = null, nextT = 0, step = 0;
  let on = ls.get('pq_music', true);
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  function init(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = on ? .9 : 0; master.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = .55; musicGain.connect(master);
  }
  function tone(f, t, dur, type = 'triangle', vol = .2, dest = master){
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  let nbuf;
  function noise(t, dur, vol, freq = 6000, dest = master){
    if (!ctx) return;
    if (!nbuf){ nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nbuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  }
  // весёлый луп: C – Am – F – G
  const prog = [[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
  const mel = [72,null,74,76, null,79,76,null, 74,null,72,74, 76,null,null,null];
  function sched(){
    const s16 = 60 / 118 / 4;
    while (nextT < ctx.currentTime + .25){
      const bar = Math.floor(step / 16) % 4, s = step % 16, ch = prog[bar];
      if (s % 4 === 0) tone(midi(ch[0] - 24), nextT, .4, 'sine', .32, musicGain);
      if (s % 4 === 2) tone(midi(ch[2] - 24), nextT, .25, 'sine', .18, musicGain);
      if (s % 2 === 0) tone(midi(ch[[0,1,2,3,2,1,2,1][(s / 2) % 8]] + 12), nextT, .2, 'triangle', .07, musicGain);
      if (s % 4 === 2) noise(nextT, .05, .06, 8000, musicGain);
      if (s === 4 || s === 12) noise(nextT, .12, .1, 1800, musicGain);
      const m = mel[(s + (bar % 2) * 3) % 16];
      if (m && bar !== 3) tone(midi(m + (bar === 2 ? -3 : 0)), nextT, .28, 'square', .035, musicGain);
      step++; nextT += s16;
    }
  }
  return {
    init,
    get on(){ return on; },
    toggle(){ on = !on; ls.set('pq_music', on); if (master) master.gain.value = on ? .9 : 0; return on; },
    music(){ init(); if (!ctx || timer) return; nextT = ctx.currentTime + .05; step = 0; musicGain.gain.value = .55; timer = setInterval(sched, 60); },
    duck(v){ if (musicGain) musicGain.gain.setTargetAtTime(v, ctx.currentTime, .3); },
    stop(){ if (timer){ clearInterval(timer); timer = null; } },
    tick(hot){ init(); if (!ctx) return; tone(hot ? 1400 : 1000, ctx.currentTime, .07, 'square', hot ? .08 : .05); },
    pop(){ init(); if (!ctx) return; const t = ctx.currentTime; tone(660, t, .12, 'triangle', .15); tone(990, t + .06, .15, 'triangle', .12); },
    correct(){ init(); if (!ctx) return; const t = ctx.currentTime; [72,76,79,84].forEach((n,i) => tone(midi(n), t + i * .09, .45, 'triangle', .16)); },
    drumroll(sec){ init(); if (!ctx) return; const t = ctx.currentTime; const n = Math.floor(sec * 22);
      for (let i = 0; i < n; i++) noise(t + i / 22, .08, .05 + .35 * (i / n), 900 + Math.random() * 300);
      noise(t + sec, .6, .5, 3000); tone(midi(41), t + sec, .7, 'sine', .5); },
    fanfare(){ init(); if (!ctx) return; const t = ctx.currentTime;
      [[67,0,.18],[67,.2,.12],[67,.34,.12],[72,.5,.9],[64,.5,.9],[76,.5,.9]].forEach(([n,d,l]) => { tone(midi(n), t + d, l + .1, 'sawtooth', .07); tone(midi(n), t + d, l + .1, 'triangle', .12); }); },
  };
})();

const Voice = {
  on: ls.get('pq_voice', true), v: null,
  pick(){ if (!('speechSynthesis' in window)) return; const vs = speechSynthesis.getVoices();
    this.v = vs.find(v => /^ru/i.test(v.lang) && /google|milena|yuri|premium|enhanced/i.test(v.name)) || vs.find(v => /^ru/i.test(v.lang)) || null; },
  say(text, {rate = 1, pitch = 1.05, onend} = {}){
    if (!this.on || !('speechSynthesis' in window)) { onend && onend(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; if (this.v) u.voice = this.v;
    u.rate = rate; u.pitch = pitch; if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  },
  stop(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); },
  toggle(){ this.on = !this.on; ls.set('pq_voice', this.on); if (!this.on) this.stop(); return this.on; },
};
if ('speechSynthesis' in window){ Voice.pick(); speechSynthesis.onvoiceschanged = () => Voice.pick(); }

function confetti(host, n = 90){
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['var(--coral)','var(--mustard)','var(--teal)','var(--pink)','var(--sky)','var(--leaf)','#fff'];
  for (let i = 0; i < n; i++){
    const d = document.createElement('div'); d.className = 'cf';
    const w = 8 + Math.random() * 12;
    d.style.cssText = `left:${Math.random()*100}%;width:${w}px;height:${w*(.5+Math.random()*.6)}px;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*2.5}s;--c:${cols[i%cols.length]}`;
    const shape = i % 3 === 0 ? 'border-radius:50%' : i % 3 === 1 ? 'clip-path:polygon(50% 0,100% 100%,0 100%)' : '';
    d.innerHTML = `<i style="${shape};animation-duration:${.6+Math.random()}s"></i>`;
    box.appendChild(d);
  }
  host.appendChild(box);
  setTimeout(() => box.remove(), 9000);
}

function garland(){
  const cols = ['#ef6f5e','#f2b134','#2a9d8f','#f7b9c6','#7b4b94','#a9d6e5'];
  let tri = '', n = 26;
  for (let i = 0; i < n; i++){
    const x = i * (1000 / n) + 6, y = 8 + Math.sin(i / (n - 1) * Math.PI) * 18;
    tri += `<polygon points="${x},${y} ${x + 30},${y + 1} ${x + 15},${y + 34}" fill="${cols[i % cols.length]}" transform="rotate(${(i % 3 - 1) * 3} ${x + 15} ${y})"/>`;
  }
  return `<svg viewBox="0 0 1000 70" preserveAspectRatio="none"><path d="M0,6 Q500,50 1000,6" stroke="#6b5a4e" stroke-width="2" fill="none"/><g style="filter:drop-shadow(2px 3px 0 rgba(70,45,20,.25))">${tri}</g></svg>`;
}

function ranking(){
  const inTb = id => S.tbPlayers.includes(id);
  const arr = plist();
  arr.sort((a, b) => b.score - a.score || (b.tb || 0) - (a.tb || 0) ||
    ((inTb(a.id) && inTb(b.id) && (a.tb || 0) > 0) ? (a.tbTime || 0) - (b.tbTime || 0) : 0) || a.name.localeCompare(b.name));
  let place = 0, prev = null;
  arr.forEach((p, i) => {
    const k = p.score + '|' + (p.tb || 0) + '|' + (inTb(p.id) && (p.tb || 0) > 0 ? p.tbTime : 0);
    if (k !== prev){ place = i + 1; prev = k; }
    p.place = place;
  });
  return arr;
}

function joinUrl(){ return location.origin + location.pathname + '?join=' + hostId + (BROKER_OVERRIDE ? '&broker=' + encodeURIComponent(BROKER_OVERRIDE) : '&b=' + brokerIdx); }
function startPeer(){
  if (typeof mqtt === 'undefined'){ setNet('⚠️ Не загрузилась игра. Проверь интернет на планшете и обнови страницу.'); return; }
  if (!hostId){ hostId = 'polya-' + rnd(8); ls.set('pq_hostid', hostId); }
  connectBroker(brokerIdx, true);
  // кто не присылал «я тут» 15 секунд — офлайн
  setInterval(() => {
    let changed = false;
    plist().forEach(p => { if (p.bot) return; const on = Date.now() - (seen[p.id] || 0) < 15000; if (S.players[p.id].online !== on){ S.players[p.id].online = on; changed = true; } });
    if (changed) hostPatch();
  }, 3000);
}
function connectBroker(i, first){
  setNet('Подключаемся к серверу игры…');
  let ok = false;
  const c = mqtt.connect(brokerUrl(i), {clientId: 'h_' + hostId + '_' + rnd(4), clean: true, reconnectPeriod: 3000, connectTimeout: 8000, keepalive: 20});
  const fail = setTimeout(() => {
    if (ok || BROKER_OVERRIDE) return;
    try{ c.end(true); }catch(e){}
    brokerIdx = (i + 1) % BROKERS.length; ls.set('pq_broker', brokerIdx);
    connectBroker(brokerIdx);
  }, 10000);
  c.on('connect', () => {
    ok = true; clearTimeout(fail); mq = c;
    c.subscribe(topic(hostId) + '/up', {qos: 1});
    setNet(''); drawQR(); broadcast();
  });
  c.on('message', (t, buf) => { let d; try{ d = JSON.parse(buf.toString()); }catch(e){ return; } onData(d); });
  c.on('offline', () => { if (ok) setNet('⚠️ Пропал интернет — переподключаемся…'); });
  c.on('error', () => {});
}
function setNet(msg){ const el = $('#netstatus'); if (el) el.innerHTML = msg ? `<div class="warn">${msg}</div>` : ''; }
function drawQR(){
  const el = $('#qr'); if (!el || !hostId) return;
  const url = joinUrl();
  if (typeof qrcode !== 'undefined'){

function onData(d){
  if (!d || typeof d !== 'object') return;
  const pid = String(d.pid || '').slice(0, 40); if (!pid) return;
  const wasSeen = seen[pid]; seen[pid] = Date.now();
  if (S.players[pid] && !S.players[pid].online){ S.players[pid].online = true; hostPatch(); }
  if (d.t === 'ping'){ if (!wasSeen) send(pid); return; }
  if (d.t === 'hello'){
    send(pid);
  } else if (d.t === 'reg'){
    const name = String(d.name || '').trim().slice(0, 16) || 'Игрок';
    const emoji = EMOJIS.includes(d.emoji) ? d.emoji : '🦊';
    const phrase = String(d.phrase || '').trim().slice(0, 70);
    const old = S.players[pid];
    S.players[pid] = old ? {...old, name, emoji, phrase, online: true}
                         : {name, emoji, phrase, score: 0, correct: 0, tb: 0, tbTime: 0, gain: null, online: true, bot: false};
    if (!old) AudioFX.pop();
    save(); hostPatch(); broadcast();
  } else if (d.t === 'ans'){
    answer(pid, d.k, d.c);
  }
}
function answer(pid, k, c){
  if (S.phase !== 'question' || k !== qkey() || !S.players[pid] || !eligible(pid) || S.answers[pid]) return;
  c = Number(c); if (!(c >= 0 && c <= 3)) return;
  S.answers[pid] = {c, t: Date.now() - S.qStart};
  AudioFX.pop(); save(); hostPatch(); broadcast();
}
function snapshot(pid){
  const p = S.players[pid];
  const st = {t: 'st', phase: S.phase, round: S.round, registered: !!p, total: S.round === 'tb' ? TB.length : Q.length, qn: S.qi + 1};
  if (p){
    const r = ranking().find(x => x.id === pid);
    st.me = {name: p.name, emoji: p.emoji, score: p.score, tb: p.tb || 0, place: r ? r.place : null, gain: p.gain};
    st.count = Object.keys(S.players).length;
  }
  if (S.phase === 'question' || S.phase === 'reveal'){
    const q = curQ();
    st.k = qkey(); st.cat = CATS[q.c].name; st.q = q.q; st.o = q.o;
    st.remain = Math.max(0, S.deadline - Date.now());
    st.eligible = !!p && eligible(pid);
    st.my = S.answers[pid] ? S.answers[pid].c : null;
    if (S.phase === 'reveal') st.a = q.a;
  }
  if (S.round === 'tb' || S.phase === 'tb_intro') st.tbNames = S.tbPlayers.map(id => S.players[id] && (S.players[id].emoji + ' ' + S.players[id].name)).filter(Boolean);
  if (S.phase === 'winner' || S.phase === 'final'){
    st.winners = S.winners.map(id => S.players[id]).filter(Boolean).map(w => ({name: w.name, emoji: w.emoji, phrase: w.phrase}));
    st.iWon = S.winners.includes(pid);
  }
  return st;
}
function send(pid){
  if (!mq || !mq.connected || String(pid).startsWith('bot-')) return;
  try{ mq.publish(topic(hostId) + '/down/' + pid, JSON.stringify(snapshot(pid)), {qos: 1, retain: true}); }catch(e){}
}
function broadcast(){ Object.keys(seen).forEach(send); }

/* ---- game flow ---- */
function setPhase(ph){ S.phase = ph; save(); hostRender(); broadcast(); }

function startGame(){
  AudioFX.init(); keepAwake(); Voice.say(' ');
  plist().forEach(p => Object.assign(S.players[p.id], {score: 0, correct: 0, tb: 0, tbTime: 0, gain: null}));
  S.round = 'main'; S.qi = -1; S.tbPlayers = []; S.winners = [];
  setPhase('intro');
}
function startQ(i){
  clearTimers(); AudioFX.stop();
  S.qi = i; S.answers = {}; S.qStart = Date.now(); S.deadline = S.qStart + QTIME; endPending = false; lastSec = -1;
  plist().forEach(p => S.players[p.id].gain = null);
  setPhase('question');
  const q = curQ(), cat = CATS[q.c];
  const lbl = S.round === 'tb' ? `Экстра-вопрос ${i + 1}.` : `Вопрос ${i + 1}.`;
  Voice.say(`${lbl} ${cat.name}. ${q.q} Варианты: ${q.o.map((o, j) => LETTERS[j] + ': ' + o).join('. ')}.`);
}
function endQuestion(){
  if (S.phase !== 'question') return;
  clearTimers();
  const q = curQ();
  eligibleList().forEach(p => {
    const a = S.answers[p.id], pl = S.players[p.id];
    const ok = a && a.c === q.a;
    if (S.round === 'main'){ pl.gain = ok ? POINTS : 0; if (ok){ pl.score += POINTS; pl.correct++; } }
    else { pl.gain = ok ? 1 : 0; if (ok){ pl.tb = (pl.tb || 0) + 1; pl.tbTime = (pl.tbTime || 0) + a.t; } }
  });
  setPhase('reveal');
  AudioFX.correct();
  Voice.say(`Правильный ответ: ${LETTERS[q.a]}. ${q.o[q.a]}.`);
}
function nextStep(){
  Voice.stop();
  if (S.phase === 'reveal'){
    if (S.round === 'main'){
      if (STANDINGS_AFTER.includes(S.qi) && Q.length > S.qi + 1) return setPhase('standings');
      if (S.qi < Q.length - 1) return startQ(S.qi + 1);
      return finishMain();
    } else {
      if (S.qi < TB.length - 1) return startQ(S.qi + 1);
      const r = ranking(); S.winners = r.filter(p => p.place === 1).map(p => p.id);
      return setPhase('winner');
    }
  }
  if (S.phase === 'standings') return startQ(S.qi + 1);
  if (S.phase === 'tb_intro'){ S.round = 'tb'; return startQ(0); }
  if (S.phase === 'winner') return setPhase('final');
}
function finishMain(){
  const ps = plist(); const top = Math.max(...ps.map(p => p.score));
  const tied = ps.filter(p => p.score === top);
  if (tied.length > 1){ S.tbPlayers = tied.map(p => p.id); return setPhase('tb_intro'); }
  S.winners = [tied[0].id];
  setPhase('winner');
}
function newGame(){
  if (!confirm('Начать новую игру? Счёт обнулится (игроки останутся).')) return;
  clearTimers(); AudioFX.stop(); Voice.stop();
  const players = S.players;
  S = FRESH();
  Object.entries(players).forEach(([id, p]) => S.players[id] = {...p, score: 0, correct: 0, tb: 0, tbTime: 0, gain: null});
  save(); lastKey = ''; hostRender(); broadcast();
}

/* ---- host render ---- */
function hostRender(force){
  const key = S.phase + '|' + S.round + '|' + S.qi;
  if (!force && key === lastKey){ hostPatch(); return; }
  lastKey = key;
  const view = {lobby: hLobby, intro: hIntro, question: hQuestion, reveal: hQuestion, standings: hStandings, tb_intro: hTbIntro, winner: hWinner, final: hFinal}[S.phase] || hLobby;
  $('#app').innerHTML = view();
  fitAll(); setTimeout(fitAll, 60); setTimeout(fitAll, 700);
  ({lobby: aLobby, intro: aIntro, question: aQuestion, reveal: aReveal, tb_intro: aTbIntro, winner: aWinner, final: aFinal, standings: aStandings})[S.phase]?.();
  hostPatch();
}
function fitAll(){
  document.querySelectorAll('[data-fit]').forEach(box => {
    const f = box.querySelector(':scope > .fit'); if (!f) return;
    if (matchMedia('(orientation:portrait)').matches){ f.style.zoom = ''; return; }
    f.style.zoom = 1;
    const cs = getComputedStyle(box);
    const avail = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const need = f.scrollHeight;
    if (need > avail && avail > 0) f.style.zoom = Math.max(.45, (avail - 4) / need).toFixed(3);
  });
}
window.addEventListener('resize', () => fitAll());
if (document.fonts) document.fonts.ready.then(() => fitAll());

  if (S.phase === 'lobby'){ patchLobby(); fitAll(); }

}

function shrink(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 900, s = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.src = url;
  });
}

  const q = curQ(), cat = CATS[q.c], rev = S.phase === 'reveal';
  const lbl = S.round === 'tb' ? `Экстра-вопрос ${S.qi + 1} из ${TB.length}` : `Вопрос ${S.qi + 1} из ${Q.length}`;
  const opts = q.o.map((o, i) => `<div class="opt paper c${i} ${o.length > 32 ? 'long' : o.length > 20 ? 'mid' : ''} ${rev ? (i === q.a ? 'right' : 'wrong') : ''}" style="--r:${SHAPE_ROT[i]}deg;animation-delay:${rev ? 0 : .25 + i * .12}s">
      <span class="ol">${LETTERS[i]}</span><span class="ot">${esc(o)}</span><span class="pickers" id="pk${i}"></span></div>`).join('');
  return `<div class="garland">${garland()}</div>
  <div class="screen qs ${rev ? 'revealed' : ''}">
    <div class="qtop">
      <div class="chip paper" style="--c:${cat.color};--r:-2deg">${cat.icon} ${cat.name}</div>
      <div class="qnum hand">${lbl}</div>
      ${rev ? '' : `<div class="timer" id="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fffaf0"/><circle id="ring" cx="50" cy="50" r="38" fill="none" stroke="var(--teal)" stroke-width="12" stroke-dasharray="238.76" stroke-dashoffset="0"/></svg><div class="num" id="tnum">45</div></div>`}
    </div>
    <div class="qcard paper" style="--r:-.5deg">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    <div class="prow" id="answeredRow"></div>
    ${rev ? `<div class="fact"><div class="paper" style="--r:-.6deg"><b>А вы знали?</b> ${esc(q.f)}</div><button class="btn coral nextbtn" id="nextBtn">Дальше ➜</button></div>` : ''}
  </div>`;
}
function aQuestion(){
  const loop = () => {
    if (S.phase !== 'question') return;
    const rem = Math.max(0, S.deadline - Date.now()), ring = $('#ring');
    if (ring){ ring.setAttribute('stroke-dashoffset', String(238.76 * (1 - rem / QTIME))); ring.setAttribute('stroke', rem < 10000 ? 'var(--coral)' : rem < 20000 ? 'var(--mustard)' : 'var(--teal)'); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  // тест-игроки отвечают сами
  const q = curQ();
  eligibleList().filter(p => p.bot && !S.answers[p.id]).forEach(p => {
    later(() => answer(p.id, qkey(), Math.random() < .6 ? q.a : (q.a + 1) % 4), 2000 + Math.random() * 15000);
  });
}
function aReveal(){
  $('#nextBtn').onclick = nextStep;
  const rightOnes = eligibleList().filter(p => p.gain > 0);
  if (rightOnes.length) setTimeout(() => confetti(document.body, 30), 300);
}
function patchQuestion(){
  const row = $('#answeredRow'); if (!row) return;
  const rev = S.phase === 'reveal', q = curQ();
  const ps = eligibleList();
  row.innerHTML = ps.map((p, i) => {
    const a = S.answers[p.id];
    if (!rev) return `<div class="pchip paper ${a ? 'done' : ''}" style="--r:${[-1.5,1,-.5,1.5][i % 4]}deg"><span class="em">${p.emoji}</span>${esc(p.name)} <span class="st">${a ? '✓ ответ' : 'думает…'}</span></div>`;
    const ok = p.gain > 0;
    const gainTxt = S.round === 'tb' ? (ok ? '+1 экстра' : '0') : (ok ? '+' + POINTS : '0');
    const tot = S.round === 'tb' ? `${p.tb || 0} из ${S.qi + 1}` : p.score;
    return `<div class="pchip paper ${ok ? 'ok' : 'no'}" style="--r:${[-1.5,1,-.5,1.5][i % 4]}deg"><span class="em">${p.emoji}</span>${esc(p.name)} <span class="st">${ok ? '✓' : (a ? '✗' : '⏱ не успел')} ${gainTxt}</span><span class="tot">· ${tot}</span></div>`;
  }).join('');
  if (rev){
    for (let i = 0; i < 4; i++){ const el = $('#pk' + i); if (el) el.innerHTML = ps.filter(p => S.answers[p.id] && S.answers[p.id].c === i).map(p => `<span class="sticker">${p.emoji}</span>`).join(''); }
  }
  const tn = $('#tnum');
  if (tn && S.phase === 'question'){ const sec = Math.ceil(Math.max(0, S.deadline - Date.now()) / 1000); tn.textContent = sec; $('#timer').classList.toggle('hot', sec <= 10); }
}

/* ---- STANDINGS ---- */
function rankRows(r, delayStep = .12){
  return r.map((p, i) => `<div class="rank paper" style="--r:${[-1,1,-.6,.8][i % 4]}deg;animation-delay:${i * delayStep}s">
    <span class="pl">${p.place}</span><span class="em">${p.emoji}</span><span class="nm">${esc(p.name)}<div class="sub">${p.correct} из ${S.round === 'tb' || S.phase === 'final' ? Q.length : S.qi + 1} верно${S.tbPlayers.includes(p.id) && (S.phase === 'final') ? ` · экстра: ${p.tb || 0}` : ''}</div></span><span class="sc">${p.score}</span></div>`).join('');
}
function hStandings(){
  return `<div class="garland">${garland()}</div><div class="screen center" style="gap:calc(var(--u)*3)" data-fit><div class="fit">
    <h1 class="bigtitle hand">Промежуточный счёт</h1><div class="small" style="font-size:calc(var(--u)*2)">после ${S.qi + 1} вопросов из ${Q.length}</div>
    <div class="ranklist">${rankRows(ranking())}</div>
    <button class="btn coral nextbtn" id="nextBtn">Следующий вопрос ➜</button></div></div>`;
}
function aStandings(){ $('#nextBtn').onclick = nextStep; Voice.say('Промежуточный счёт! Лидирует ' + ranking()[0].name + '.'); }

/* ---- TIEBREAK ---- */
function hTbIntro(){
  const ps = S.tbPlayers.map(id => ({id, ...S.players[id]}));
  return `<div class="garland">${garland()}</div><div class="screen center" style="gap:calc(var(--u)*3)" data-fit><div class="fit">
    <h1 class="bigtitle hand pop" style="color:var(--wine)">Ничья на вершине!</h1>
    <div class="others">${ps.map((p, i) => `<div class="pcard paper" style="--r:${i % 2 ? 2 : -2}deg;animation-delay:${.3 + i * .2}s"><div class="em">${p.emoji}</div><div><div class="nm">${esc(p.name)}</div><div class="ph">${p.score} очков</div></div></div>`).join('')}</div>
    <div class="tag paper" style="--r:-1deg;font-size:calc(var(--u)*3)">👑 Супер-игра: ${TB.length} экстра-вопроса решат, кто заберёт корону.<br><span class="small" style="font-size:.7em">Отвечают только финалисты. Если и тут ничья — побеждает тот, кто отвечал быстрее.</span></div>
    <button class="btn coral nextbtn" id="nextBtn">Начать супер-игру ▶</button></div></div>`;
}
function aTbIntro(){
  $('#nextBtn').onclick = nextStep; AudioFX.drumroll(1.5);
  const names = S.tbPlayers.map(id => S.players[id].name).join(' и ');
  Voice.say(`Ничья! У ${names} одинаковое количество очков. Супер-игра: три экстра-вопроса!`);
}

/* ---- WINNER «видео» ---- */
function hWinner(){
  const ws = S.winners.map(id => S.players[id]).filter(Boolean);
  const multi = ws.length > 1;
  return `<div class="win" id="win"><div class="spot"></div>
    <div class="and">и побеждает…</div>
    <div class="winbox">
      <div class="crown sticker">👑</div>
      <div style="display:flex;gap:calc(var(--u)*4)">${ws.map(w => `<div class="winem sticker" style="${multi ? 'font-size:calc(var(--u)*16)' : ''}">${w.emoji}</div>`).join('')}</div>
      <div class="ribbon">${ws.map(w => esc(w.name)).join(' и ')}</div>
      ${ws.filter(w => w.phrase).map(w => `<div class="bubble">«${esc(w.phrase)}»${multi ? ` — ${esc(w.name)}` : ''}</div>`).join('')}
    </div>
    <button class="btn mustard nextbtn finalbtn" id="nextBtn">Итоговый рейтинг ➜</button>
  </div>`;
}
function aWinner(){
  clearTimers(); AudioFX.stop();
  const win = $('#win'); $('#nextBtn').onclick = () => { AudioFX.stop(); nextStep(); };
  const ws = S.winners.map(id => S.players[id]).filter(Boolean);
  Voice.say('И побеждает…', {rate: .9});
  AudioFX.drumroll(3.2);
  later(() => {
    win.classList.add('lit'); AudioFX.fanfare(); confetti(win, 140);
    Voice.say((ws.length > 1 ? 'Побеждают ' : 'Побеждает ') + ws.map(w => w.name).join(' и ') + '!', {pitch: 1.15});
  }, 3400);
  later(() => { win.classList.add('phrase'); const ph = ws.filter(w => w.phrase).map(w => w.phrase).join('. '); if (ph) Voice.say(ph, {pitch: 1.1}); }, 6200);
  later(() => { AudioFX.music(); AudioFX.duck(.45); confetti(win, 80); }, 8500);
  later(() => win.classList.add('done'), 10500);
}

/* ---- FINAL ---- */
function hFinal(){
  const r = ranking();
  const pod = r.slice(0, 3), rest = r.slice(3);
  const order = pod.length === 3 ? [pod[1], pod[0], pod[2]] : pod.length === 2 ? [pod[1], pod[0]] : pod;
  const h = {1: 15, 2: 10, 3: 7};
  return `<div class="garland">${garland()}</div><div class="screen center" style="gap:calc(var(--u)*1.5)" data-fit><div class="fit">
    <h1 class="bigtitle hand">Итоговый рейтинг</h1>
    <div class="podium">${order.map((p, i) => `<div class="pod">
      <div class="em sticker" style="animation-delay:${i * .3}s">${p.emoji}</div><div class="nm">${esc(p.name)}</div>
      <div class="block c${[1,0,2][i] ?? 3}" style="height:calc(var(--u)*${h[Math.min(p.place, 3)]});animation-delay:${.2 + i * .25}s">${p.place}<small>${p.score} очк.${p.tb ? ' · экстра ' + p.tb : ''}</small></div></div>`).join('')}</div>
    ${rest.length ? `<div class="ranklist" style="margin-top:calc(var(--u)*2)">${rankRows(rest)}</div>` : ''}
    <div style="display:flex;gap:12px;margin-top:calc(var(--u)*2)"><button class="btn" id="replayWin">🎬 Ещё раз победное видео</button><button class="btn" id="newGameBtn">↺ Новая игра</button></div>
  </div></div>`;
}
function aFinal(){
  $('#replayWin').onclick = () => setPhase('winner');
  $('#newGameBtn').onclick = newGame;
  if (!AudioFX.on) return; AudioFX.music(); AudioFX.duck(.3);
}

function hostTools(){
  const t = $('#tools');
  t.innerHTML = `<button id="tMusic" title="Музыка и звуки" class="${AudioFX.on ? '' : 'off'}">🎵</button><button id="tVoice" title="Озвучка вопросов" class="${Voice.on ? '' : 'off'}">🗣️</button>
    <button id="tFull" title="Полный экран">⛶</button><button id="tNew" title="Новая игра">↺</button>`;
  $('#tMusic').onclick = e => { e.currentTarget.classList.toggle('off', !AudioFX.toggle()); };
  $('#tVoice').onclick = e => { e.currentTarget.classList.toggle('off', !Voice.toggle()); };
  $('#tFull').onclick = () => { const d = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); };
  $('#tNew').onclick = newGame;
}

function hostTick(){
  if (S.phase !== 'question') return;
  const rem = S.deadline - Date.now(), sec = Math.ceil(Math.max(0, rem) / 1000);
  if (sec !== lastSec){ lastSec = sec; patchQuestion(); if (sec <= 10 && sec > 0) AudioFX.tick(sec <= 3); }
  if (rem <= 0) return endQuestion();
  const el = eligibleList();
  if (el.length && el.every(p => S.answers[p.id]) && !endPending){
    endPending = true; setTimeout(() => { endPending = false; if (S.phase === 'question' && eligibleList().every(p => S.answers[p.id])) endQuestion(); }, 900);
  }
}

function initHost(){
  document.body.classList.add('host');
  // после перезагрузки планшета: игроки офлайн, пока не переподключатся
  plist().forEach(p => { if (!p.bot) S.players[p.id].online = false; });
  if (S.phase === 'intro') S.phase = 'lobby';
  hostTools(); hostRender(true); startPeer();
  setInterval(hostTick, 200);
  document.addEventListener('pointerdown', () => AudioFX.init(), {once: true});
}

/* =====================================================================
   PLAYER (телефон)
   ===================================================================== */
const PID = ls.get('pq_pid', null) || (() => { const id = 'p-' + rnd(10); ls.set('pq_pid', id); return id; })();
let pc = null, st = null, stAt = 0, connected = false, hb = null;
let draft = ls.get('pq_draft', {name: '', emoji: '', phrase: ''});
let pKey = '', myPick = null;

function pConnect(){
  if (typeof mqtt === 'undefined'){ pStatus('Не загрузилась игра. Проверь интернет и обнови страницу.'); return; }
  pStatus('Подключаемся к экрану…');
  pc = mqtt.connect(brokerUrl(brokerIdx), {clientId: 'p_' + PID + '_' + rnd(4), clean: true, reconnectPeriod: 2000, connectTimeout: 8000, keepalive: 20});
  pc.on('connect', () => {
    connected = true;
    pc.subscribe(topic(JOIN) + '/down/' + PID, {qos: 1});
    psend({t: 'hello'});
    if (!st) pStatus('Ищем экран ведущего…');
    else pStatus('');
  });
  pc.on('message', (t, buf) => {
    let d; try{ d = JSON.parse(buf.toString()); }catch(e){ return; }
    if (d && d.t === 'st'){ const first = !st; st = d; stAt = performance.now(); if (first) pKey = ''; pRender(); pStatus(''); }
  });
  pc.on('offline', () => { connected = false; pStatus('Связь пропала, переподключаемся…'); });
  pc.on('error', () => {});
  clearInterval(hb);
  let tick = 0;
  hb = setInterval(() => {
    if (!connected) return; tick++;
    psend({t: st ? 'ping' : 'hello'});
    if (!st && tick >= 2) pStatus('Не видим экран ведущего… Он включён и показывает QR?');
  }, 5000);
}
function pStatus(msg){ const el = $('#pstatus'); if (el) el.textContent = msg; else if (msg) { $('#app').innerHTML = `<div class="ph"><div class="wait"><span class="big">📡</span><span class="hand">${esc(msg)}</span></div><div class="status" id="pstatus"></div></div>`; } }
function psend(o){ if (pc && pc.connected){ try{ pc.publish(topic(JOIN) + '/up', JSON.stringify({...o, pid: PID}), {qos: 1}); return true; }catch(e){} } return false; }

function meBar(){
  if (!st.me) return '';
  return `<div class="me paper" style="--r:-.5deg"><span class="em">${st.me.emoji}</span><span class="nm">${esc(st.me.name)}</span><span class="sc">${st.me.score} очк.</span></div>`;
}
function pRender(){
  if (!st) return;
  const app = $('#app');
  const key = [st.phase, st.k, st.registered, st.my, st.phase === 'lobby' ? st.count : ''].join('|');
  if (key === pKey && st.phase !== 'reveal') { pPatch(); return; }
  pKey = key;
  if (!st.registered) { app.innerHTML = pReg(); aReg(); return; }
  let body = '';
  switch (st.phase){
    case 'lobby': body = `<div class="wait paper"><span class="big">${st.me.emoji}</span><span class="hand">Ты в игре!</span><br>Смотри на большой экран — скоро начнём.<div class="small" style="margin-top:8px">Игроков: ${st.count}</div></div>
                     <button class="btn" id="editBtn">✏️ Изменить имя или смайлик</button>`; break;
    case 'intro': body = `<div class="wait paper"><span class="big">👀</span><span class="hand">Смотрим на экран!</span><br>Знакомимся с именинницей.</div>`; break;
    case 'question': body = pQuestion(); break;
    case 'reveal': body = pReveal(); break;
    case 'standings': body = `<div class="res paper"><div class="big">📊</div><h2>${st.me.place}-е место</h2><div class="pts">${st.me.score} очков</div><div class="ans">Промежуточный счёт — на экране</div></div>`; break;
    case 'tb_intro': body = `<div class="res paper"><div class="big">⚔️</div><h2>Ничья!</h2><div class="ans">Супер-игра: ${esc((st.tbNames || []).join(' vs '))}</div></div>`; break;
    case 'winner': case 'final': {
      const w = (st.winners || []);
      body = st.iWon ? `<div class="res paper" style="background:#fff3c4"><div class="big">👑</div><h2>Ты победил(а)!</h2><div class="pts">${st.me.score} очков</div></div>`
                     : `<div class="res paper"><div class="big">${w.map(x => x.emoji).join(' ')}</div><h2>Победа: ${esc(w.map(x => x.name).join(' и '))}</h2><div class="pts">Твоё место: ${st.me.place} · ${st.me.score} очков</div></div>`;
      break;
    }
  }
  app.innerHTML = `<div class="ph">${meBar()}${body}<div class="status" id="pstatus"></div></div>`;
  const eb = $('#editBtn'); if (eb) eb.onclick = () => { st.registered = false; pKey = ''; draft = {...draft, name: st.me.name, emoji: st.me.emoji}; pRender(); };
  if (st.phase === 'question') aPQuestion();
  if (st.phase === 'reveal' && st.eligible && st.my === st.a && navigator.vibrate) navigator.vibrate([60, 40, 60]);
}
function pReg(){
  return `<div class="ph">
    <h1><span class="hand">квиз для Поли 🎂</span>Регистрация</h1>
    <div class="card paper" style="--r:-.6deg"><label class="lbl" for="nm">Как тебя зовут?</label><input type="text" id="nm" maxlength="16" placeholder="Имя или прозвище" value="${esc(draft.name)}" autocomplete="off"></div>
    <div class="card paper" style="--r:.5deg"><label class="lbl">Выбери смайлик</label><div class="emojis">${EMOJIS.map(e => `<button type="button" class="${draft.emoji === e ? 'sel' : ''}" data-e="${e}">${e}</button>`).join('')}</div></div>
    <div class="card paper" style="--r:-.4deg"><label class="lbl" for="phr">Твоя победная фраза</label><input type="text" id="phr" maxlength="70" placeholder="Например: «Гаумарджос, неудачники!»" value="${esc(draft.phrase)}" autocomplete="off">
      <div class="small" style="margin-top:6px">Её покажут и озвучат на экране, если ты победишь.</div></div>
    <button class="btn coral go" id="regBtn">Я в игре! 🎉</button>
    <div class="status" id="pstatus"></div></div>`;
}
function aReg(){
  const upd = () => { draft.name = $('#nm').value; draft.phrase = $('#phr').value; ls.set('pq_draft', draft); };
  $('#nm').oninput = upd; $('#phr').oninput = upd;
  document.querySelectorAll('.emojis button').forEach(b => b.onclick = () => {
    draft.emoji = b.dataset.e; ls.set('pq_draft', draft);
    document.querySelectorAll('.emojis button').forEach(x => x.classList.toggle('sel', x === b));
  });
  $('#regBtn').onclick = () => {
    upd();
    if (!draft.name.trim()){ $('#nm').focus(); $('#nm').style.borderColor = 'var(--coral)'; return; }
    if (!draft.emoji){ alert('Выбери смайлик 🙂'); return; }
    keepAwake();
    if (!psend({t: 'reg', name: draft.name, emoji: draft.emoji, phrase: draft.phrase})) pStatus('Нет связи с экраном, пробуем ещё…');
    else $('#regBtn').textContent = 'Отправляем…';
  };
}
function pQuestion(){
  if (!st.eligible) return `<div class="wait paper"><span class="big">🍿</span><span class="hand">Супер-игра!</span><br>Отвечают финалисты: ${esc((st.tbNames || []).join(' и '))}.<br>Болей громко!</div>`;
  const mine = st.my != null ? st.my : myPick;
  return `<div class="pq paper"><div class="meta">${esc(st.cat)} · ${st.round === 'tb' ? 'экстра-вопрос' : 'вопрос'} ${st.qn} из ${st.total}</div>${esc(st.q)}</div>
    <div class="pbar"><i id="pbar"></i></div>
    <div class="popts">${st.o.map((o, i) => `<button class="popt paper c${i} ${o.length > 32 ? 'long' : ''} ${mine != null ? (mine === i ? 'mine' : 'dim') : ''}" data-c="${i}" style="--r:${SHAPE_ROT[i] / 2}deg"><span class="ol">${LETTERS[i]}</span>${esc(o)}</button>`).join('')}</div>
    ${mine != null ? `<div class="wait" style="padding:8px"><span class="hand">Ответ принят! Ждём остальных…</span></div>` : ''}`;
}
function aPQuestion(){
  if (!st.eligible) return;
  if (st.my == null) myPick = null;
  document.querySelectorAll('.popt').forEach(b => b.onclick = () => {
    if (st.my != null || myPick != null) return;
    myPick = Number(b.dataset.c);
    if (navigator.vibrate) navigator.vibrate(30);
    psend({t: 'ans', k: st.k, c: myPick});
    pKey = ''; pRender();
  });
  pPatch();
}
function pPatch(){
  const bar = $('#pbar'); if (!bar || !st || st.phase !== 'question') return;
  const rem = Math.max(0, st.remain - (performance.now() - stAt));
  bar.style.transform = `scaleX(${rem / QTIME})`;
  bar.style.background = rem < 10000 ? 'var(--coral)' : rem < 20000 ? 'var(--mustard)' : 'var(--teal)';
}
function pReveal(){
  if (!st.eligible) return `<div class="res paper"><div class="big">🍿</div><h2>Правильный ответ: ${LETTERS[st.a]}</h2><div class="ans">${esc(st.o[st.a])}</div></div>`;
  const ok = st.my === st.a;
  const gain = st.round === 'tb' ? (ok ? '+1 в супер-игре' : '0') : (ok ? '+' + POINTS + ' очков' : '0 очков');
  return `<div class="res paper" style="background:${ok ? '#e3f1d6' : '#f8ddd6'}">
    <div class="big">${ok ? '🎉' : st.my == null ? '⏰' : '🙈'}</div>
    <h2>${ok ? 'Верно!' : st.my == null ? 'Не успел(а)!' : 'Мимо!'}</h2>
    <div class="pts">${gain}</div>
    <div class="ans">Правильно: ${LETTERS[st.a]} — ${esc(st.o[st.a])}</div>
    <div class="ans">Сейчас ты на ${st.me.place}-м месте</div></div>`;
}

function initPlayer(){
  document.body.classList.add('player');
  pStatus('Подключаемся к экрану…');
  pConnect();
  setInterval(pPatch, 200);
}

IS_HOST ? initHost() : initPlayer();
</script>
</body>
</html>
